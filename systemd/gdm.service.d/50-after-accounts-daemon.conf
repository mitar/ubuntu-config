# Installed as /etc/systemd/system/gdm.service.d/50-after-accounts-daemon.conf by configure-gnome-desktop.sh, which
# overwrites edits made there.
#
# GDM lists the users for the login screen through accounts-daemon, but its unit does not order it relative to
# accounts-daemon. At shutdown systemd stops both at once, accounts-daemon is gone first, and GDM, which still queries
# it, logs "Failed to list cached users" and exits with status 1, which leaves gdm.service failed at every shutdown.
# Ordered after accounts-daemon, GDM starts after it and is stopped before it.
#
# Not needed any more once GDM's own unit has this ordering: https://gitlab.gnome.org/GNOME/gdm/-/merge_requests/418

[Unit]
After=accounts-daemon.service
