# Installed as /etc/systemd/user/app-.scope.d/50-graphical-session.conf by configure-gnome-desktop.sh, which
# overwrites edits made there. It applies to every scope of a user's service manager whose name starts with app-.
#
# Chromium, and every Electron application built on it, moves its browser process into a scope of its own,
# app-<name>-<pid>.scope, so that xdg-desktop-portal can identify it, while its zygotes, GPU process and other
# helpers stay in the app-gnome-*.scope GNOME launched it in. gnome-session ties only GNOME's scopes to the session,
# so at logout and shutdown systemd stops the helpers while the browser process keeps running, cannot start its GPU
# process again, and crashes with "GPU process isn't usable. Goodbye.". With every application scope tied to the
# session, both scopes are stopped together, and the application exits cleanly. GNOME's scopes are tied to it
# already, by /usr/lib/systemd/user/app-gnome-.scope.d/override.conf.
#
# Not needed any more once Chromium keeps its helpers in its own scope: https://issues.chromium.org/issues/580525223

[Unit]
PartOf=graphical-session.target
