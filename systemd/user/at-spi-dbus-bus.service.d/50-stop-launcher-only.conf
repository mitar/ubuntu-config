# Installed as /etc/systemd/user/at-spi-dbus-bus.service.d/50-stop-launcher-only.conf by configure-gnome-desktop.sh,
# which overwrites edits made there.
#
# With the default KillMode=control-group, systemd sends SIGTERM at the same time to at-spi-bus-launcher and to the
# accessibility bus it started. When the launcher notices that its bus exited before it handles its own SIGTERM, it
# takes that for a failure, logs "Failed to launch bus: Bus exited with code 0" and exits with status 1, so the unit
# sometimes failed when a session ended. The launcher ends its bus itself when it receives SIGTERM, so here it alone
# receives it.
#
# Not needed any more once at-spi2-core's own unit does the same:
# https://gitlab.gnome.org/GNOME/at-spi2-core/-/merge_requests/239

[Service]
KillMode=mixed
