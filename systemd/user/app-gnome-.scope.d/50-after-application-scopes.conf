# Installed as /etc/systemd/user/app-gnome-.scope.d/50-after-application-scopes.conf by configure-gnome-desktop.sh,
# which overwrites edits made there. It applies to the scopes GNOME launches applications in.
#
# systemd stops units in the reverse of their order, so at logout a scope of GNOME is stopped only after
# stop-application-scopes.service has stopped, which stops the scopes applications created for themselves first. See
# that service for why.

[Unit]
Before=stop-application-scopes.service
