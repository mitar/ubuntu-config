# Installed as /etc/systemd/user/snap.snapd-desktop-integration.snapd-desktop-integration.service.d/
# 50-graphical-session.conf by configure-gnome-desktop.sh, which overwrites edits made there.
#
# snapd generates the user service of snapd-desktop-integration with WantedBy=default.target, so every user's service
# manager starts it when it starts, before there is a display. It then fails with "Failed to open display" until its
# restarts reach the session, and it fails again at logout when the display goes away under it. Here it is also
# started with the graphical session, through a link which configure-gnome-desktop.sh adds to
# graphical-session.target.wants, and its start from default.target is skipped while there is no display. It is
# stopped with the session, before GNOME Shell and so while the display is still there, because it is ordered after
# graphical-session.target, which is ordered after GNOME Shell.
#
# Not needed any more once snapd ties user services of snaps which use the desktop to the graphical session:
# https://github.com/canonical/snapd/pull/16687

[Unit]
After=graphical-session.target
PartOf=graphical-session.target
ConditionEnvironment=|WAYLAND_DISPLAY
ConditionEnvironment=|DISPLAY
