# Installed as /etc/systemd/user/snap.snapd-desktop-integration.snapd-desktop-integration.service.d/
# 50-graphical-session.conf by configure-gnome-desktop.sh, which overwrites edits made there.
#
# snapd generates the user service of snapd-desktop-integration with WantedBy=default.target, so every user's service
# manager starts it when it starts, before there is a display. It then fails with "Failed to open display" until its
# restarts reach the session, and it fails again at logout when the display goes away under it. Here it is also
# started with the graphical session, through a link which configure-gnome-desktop.sh adds to
# graphical-session.target.wants, and its start from default.target is skipped while there is no display. It is
# stopped with the session, before GNOME Shell and so while the display is still there, because it is ordered after
# graphical-session.target, which is ordered after GNOME Shell.
#
# The [Unit] section and the link are not needed any more once the installed snapd ties user services of snaps which
# use the desktop to the graphical session, which "systemctl --user cat" then shows as Requisite= and PartOf= on
# graphical-session.target in the generated unit: https://github.com/canonical/snapd/pull/16687 (which needs #16685
# and #16686). It does not change how the launcher exits, so the [Service] section stays until the snap does:
# https://github.com/canonical/snapd-desktop-integration/issues/174

[Unit]
After=graphical-session.target
PartOf=graphical-session.target
ConditionEnvironment=|WAYLAND_DISPLAY
ConditionEnvironment=|DISPLAY

[Service]
# The snap starts its daemon through a launcher, src/user-session-helper/ in snapd-desktop-integration, which exits with
# status 2 whenever it wants to be started again: when it started before the session was ready, when the daemon exits,
# as it does when GNOME ends the session, and when systemd stops it with SIGTERM. Counted as a failure, that leaves the
# unit failed at every logout, so status 2 counts as success here, and restarting is still forced for it. systemd does
# not restart a unit it is stopping itself, so the restart only happens while the session runs.
SuccessExitStatus=2
RestartForceExitStatus=2
