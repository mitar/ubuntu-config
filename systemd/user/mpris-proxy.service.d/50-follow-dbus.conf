# Installed as /etc/systemd/user/mpris-proxy.service.d/50-follow-dbus.conf by configure-gnome-desktop.sh, which
# overwrites edits made there. configure-gnome-desktop.sh also adds a link to mpris-proxy.service to
# /etc/systemd/user/dbus.service.wants, so that it is started whenever the user's D-Bus is.
#
# When a GNOME session ends, gnome-session-restart-dbus.service stops the user's D-Bus, which starts again through its
# socket once something connects to it. libdbus ends mpris-proxy with exit status 1 when the bus closes its
# connection, and nothing started it again while the user's service manager kept running, which it does when the user
# logs in again within logind's UserStopDelaySec=. The login screen's session ends the same way. Tied to the bus, it
# is stopped before the bus is, and the link starts it again together with the bus.
#
# Not needed any more once bluez's own unit does the same:
# https://lore.kernel.org/linux-bluetooth/20261103151724.598627-1-mitar.git@tnode.com/T/

[Unit]
PartOf=dbus.service
