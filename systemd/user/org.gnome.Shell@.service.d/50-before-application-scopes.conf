# Installed as /etc/systemd/user/org.gnome.Shell@.service.d/50-before-application-scopes.conf by
# configure-gnome-desktop.sh, which overwrites edits made there. It applies to every instance of GNOME Shell's unit.
#
# GNOME's application scopes are not ordered relative to GNOME Shell, so when the session ends, at logout and at
# shutdown, systemd stops the Shell while the applications are still quitting. GTK ends a process whose Wayland
# connection breaks at once, with exit status 1, and a Chromium-based application, which loads GTK, is then cut off in
# the middle of its shutdown. Ordered before stop-application-scopes.service, the Shell is stopped only after that
# service let each Chromium-based application quit by itself.

[Unit]
Before=stop-application-scopes.service
