# Installed as /etc/systemd/system/tmp.mount.d/50-nr-inodes.conf by install-rebuild-patched-packages.sh, which
# overwrites edits made there.
#
# /tmp is a tmpfs, and systemd's tmp.mount caps it at 1,048,576 files (nr_inodes=1m), however much space is free.
# rebuild-patched-packages builds in /tmp, and a Firefox build there holds the unpacked source of nearly 600,000
# files in sbuild's chroot, plus the build directory and the chroot itself, which leaves little room below that cap.
# An inode costs memory only while its file exists, so a higher cap costs nothing until it is used. The space limit
# stays at half of the memory.
#
# Options replaces the whole option string of tmp.mount, so it repeats systemd's own with only nr_inodes changed.
# After a systemd upgrade, compare it with the Options line "systemctl cat tmp.mount" shows first.

[Mount]
Options=mode=1777,strictatime,nosuid,nodev,size=50%%,nr_inodes=4m,x-systemd.graceful-option=usrquota
