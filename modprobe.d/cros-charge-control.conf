# Installed by configure-gnome-desktop.sh, which overwrites edits made here.
#
# The driver stays away by default when the embedded controller also offers Framework's own charge limit, the one
# the BIOS changes. Loading it anyway exposes charge thresholds on the battery, which UPower and GNOME Settings use.
# Both end up in the same charge sustainer of the controller. With the firmware's limit at 100% the firmware clears
# the sustainer every second, so these thresholds never take effect. With it below 100% the firmware sets its own
# window, from 5% below the limit up to the limit, only when the limit changes or the controller starts, so set the
# limit in the BIOS to 99%.
options cros_charge_control probe_with_fwk_charge_control=1
