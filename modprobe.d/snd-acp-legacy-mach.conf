# Installed by configure-gnome-desktop.sh, which overwrites edits made here.
#
# The machine driver of the APU's audio coprocessor registers the acp-pdm-mach card for the coprocessor's digital
# microphone, which has no microphones wired to it on this laptop. The card's PCM opens and reads fine, but returns
# a signal railed at negative full scale instead of audio, while the sound server offers it as a second internal
# microphone, where it can be chosen by mistake. Without the driver the card stays unregistered.
#
# ALSA UCM takes the presence of a card named acp* as the sign that it has a configuration for the HD-Audio card of
# the Realtek codec (HDA/HDA.conf), and that configuration is what links the two cards together. Without the
# coprocessor's card the configuration does not apply, and the codec gets the profiles PipeWire builds on its own
# instead: one "Analog Stereo Duplex" configuration whose ports follow the jacks, in place of four combinations
# which differ in which output and which microphone they leave out.
#
# The driver of the coprocessor's PCI function is the wrong one to keep away, because SOF's driver for the same
# function matches the same PCI identifier and would bind it instead.
blacklist snd_acp_legacy_mach
